name: felicette_recipes
description: "A Flutter application for managing recipes, ingredients and shopping lists."
publish_to: "none"
version: 0.0.15+15

environment:
  sdk: ^3.10.0

dependencies:
  app_links: ^6.4.1
  authentication_repository:
    path: packages/authentication_repository
  cloud_firestore: ^6.0.3
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.8.1
  equatable: ^2.0.7
  firebase_app_check: ^0.4.1+1
  firebase_auth: ^6.1.1
  firebase_core: ^4.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  formz: ^0.8.0
  go_router: ^17.0.0
  group_repository:
    path: packages/group_repository
  ingredient_repository:
    path: packages/ingredient_repository
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  recipe_repository:
    path: packages/recipe_repository
  secure_storage:
    path: packages/secure_storage
  user_repository:
    path: packages/user_repository
  uuid: ^4.5.2

dev_dependencies:
  bloc_lint: ^0.3.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_intl:
  enabled: true
